<!DOCTYPE html>
<html>
<head>
    <title>India Market Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#111827;
            color:white;
            padding:20px;
        }
        .card{
            background:#1f2937;
            padding:15px;
            border-radius:10px;
            margin-bottom:10px;
        }
        h1{
            color:#60a5fa;
        }
    </style>
</head>
<body>

<h1>India Pre-Market Dashboard</h1>

<div class="card">
    <h3>Market Bias</h3>
    <p>Bullish / Neutral / Bearish</p>
</div>

<div class="card">
    <h3>Gift Nifty</h3>
    <p>Loading...</p>
</div>

<div class="card">
    <h3>US Markets</h3>
    <p>S&P 500, Nasdaq, Dow</p>
</div>

<div class="card">
    <h3>Commodities</h3>
    <p>Gold, Silver, Brent Crude</p>
</div>

<div class="card">
    <h3>AI Outlook</h3>
    <p>Daily market commentary will appear here.</p>
</div>

</body>
</html>
