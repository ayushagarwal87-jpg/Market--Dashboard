
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Pre-Market Dashboard V4</title>
<style>
body{background:#0b1220;color:#fff;font-family:Arial,sans-serif;padding:16px;max-width:900px;margin:auto}
.card,.section{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;margin-bottom:16px}
h1{margin-bottom:6px}
.subtitle{color:#94a3b8;margin-bottom:16px}
.bias{font-size:34px;font-weight:bold;color:#22c55e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.label{color:#94a3b8;font-size:13px}
.value{font-size:24px;font-weight:bold}
ul{padding-left:20px}
table{width:100%;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid #1f2937}
.footer{text-align:center;color:#64748b;margin-top:20px}
</style>
</head>
<body>

<h1>📈 India Pre‑Market Dashboard</h1>
<div class="subtitle">Cloudflare Worker Powered</div>

<div class="card">
  <div class="label">Market Bias</div>
  <div id="marketBias" class="bias">Loading...</div>
</div>

<div class="section">
<h2>🌍 Global Triggers</h2>
<ul id="globalTriggers">
<li>Loading...</li>
</ul>
</div>

<div class="grid">
<div class="section">
<h2>🎯 Nifty Levels</h2>
<p>S1: <span id="s1">--</span></p>
<p>S2: <span id="s2">--</span></p>
<p>R1: <span id="r1">--</span></p>
<p>R2: <span id="r2">--</span></p>
</div>

<div class="section">
<h2>🏦 Sector Outlook</h2>
<table>
<tr><td>Banks</td><td id="banks">--</td></tr>
<tr><td>IT</td><td id="it">--</td></tr>
<tr><td>Metals</td><td id="metals">--</td></tr>
<tr><td>Realty</td><td id="realty">--</td></tr>
<tr><td>PSU</td><td id="psu">--</td></tr>
</table>
</div>
</div>

<div class="section">
<h2>🤖 AI Outlook</h2>
<p id="outlook">Loading...</p>
</div>

<div class="footer">Version 4</div>

<script>
async function loadData(){
 try{
  const r=await fetch("https://market-dashboard-api.ayush-agarwal87.workers.dev/");
  const d=await r.json();

  document.getElementById("marketBias").textContent=d.marketBias;

  const ul=document.getElementById("globalTriggers");
  ul.innerHTML="";
  d.globalTriggers.forEach(x=>{
    const li=document.createElement("li");
    li.textContent=x;
    ul.appendChild(li);
  });

  document.getElementById("s1").textContent=d.niftyLevels.support1;
  document.getElementById("s2").textContent=d.niftyLevels.support2;
  document.getElementById("r1").textContent=d.niftyLevels.resistance1;
  document.getElementById("r2").textContent=d.niftyLevels.resistance2;

  document.getElementById("banks").textContent=d.sectorOutlook.banks;
  document.getElementById("it").textContent=d.sectorOutlook.it;
  document.getElementById("metals").textContent=d.sectorOutlook.metals;
  document.getElementById("realty").textContent=d.sectorOutlook.realty;
  document.getElementById("psu").textContent=d.sectorOutlook.psu;

  document.getElementById("outlook").textContent=d.outlook;
 }catch(e){
  document.getElementById("outlook").textContent="Unable to load data.";
 }
}
loadData();
</script>

</body>
</html>
