<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Market Dashboard</title>
<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}
.card{
  background:#1e293b;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}
h1{
  margin-top:0;
}
.green{
  color:#22c55e;
}
</style>
</head>
<body>

<h1>📈 India Pre-Market Dashboard</h1>

<div class="card">
  <h3>Market Bias</h3>
  <p class="green">Bullish</p>
</div>

<div class="card">
  <h3>Gift Nifty</h3>
  <p>Coming Soon</p>
</div>

<div class="card">
  <h3>US Markets</h3>
  <p>S&P 500 • Nasdaq • Dow</p>
</div>

<div class="card">
  <h3>Commodities</h3>
  <p>Gold • Silver • Brent Crude</p>
</div>

<div class="card">
  <h3>AI Outlook</h3>
  <p>Dashboard upgrade in progress.</p>
</div>

</body>
</html>
